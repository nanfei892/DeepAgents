<!doctype html>
<!-- lang 属性帮助浏览器、输入法和无障碍工具识别中文页面。 -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智服中台 - 客户服务</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ink: #17212b;
            --muted: #657382;
            --line: #dce5e8;
            --canvas: #f5f8f7;
            --surface: #fff;
            --teal: #087f78;
            --teal-dark: #05665f;
            --teal-soft: #e3f4f1;
            --orange: #c45318;
            --orange-soft: #fff0e8;
            --danger: #b42318;
            --shadow: 0 10px 30px rgba(23, 33, 43, .08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font: 15px/1.55 Inter, "Microsoft YaHei", system-ui, sans-serif;
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
            outline: 3px solid rgba(8, 127, 120, .32);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .topbar {
            height: 68px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(24px, calc((100% - 1240px) / 2));
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--teal);
            color: #fff;
        }

        .brand-mark svg {
            width: 20px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-weight: 650;
        }

        .nav a[aria-current="page"] {
            background: var(--teal-soft);
            color: var(--teal-dark);
        }

        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        .page-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .page-head p {
            margin: 7px 0 0;
            color: var(--muted);
        }

        .identity {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 9px 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .identity i {
            color: var(--teal);
            width: 18px;
        }

        .identity strong {
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, monospace;
        }

        .layout {
            display: grid;
            grid-template-columns:minmax(0, 1fr) 330px;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .chat {
            min-height: 590px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .panel-title h2 {
            margin: 0;
            font-size: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #21a179;
        }

        .messages {
            flex: 1;
            padding: 22px 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 360px;
        }

        .empty {
            margin: auto;
            max-width: 390px;
            text-align: center;
            color: var(--muted);
        }

        .empty i {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: var(--teal-soft);
            color: var(--teal);
        }

        .empty h3 {
            margin: 0 0 5px;
            color: var(--ink);
            font-size: 16px;
        }

        .message {
            max-width: 84%;
            display: grid;
            gap: 4px;
        }

        .message.mine {
            align-self: end;
        }

        .message-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .message.mine .message-meta {
            text-align: right;
        }

        .bubble {
            padding: 11px 13px;
            border-radius: 7px;
            background: #f0f4f5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .mine .bubble {
            background: var(--teal);
            color: #fff;
        }

        .system {
            max-width: 100%;
            padding: 10px 12px;
            border-left: 3px solid var(--teal);
            background: var(--teal-soft);
            color: #075e58;
            border-radius: 4px;
            font-size: 13px;
        }

        .handoff {
            max-width: 100%;
            padding: 12px;
            border: 1px solid #f2c7b2;
            background: var(--orange-soft);
            color: #9b3e12;
            border-radius: 6px;
        }

        .handoff strong {
            display: block;
            margin-bottom: 2px;
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 14px;
            display: flex;
            gap: 10px;
        }

        .composer textarea {
            resize: none;
            min-height: 46px;
            max-height: 120px;
            flex: 1;
            border: 1px solid #b8c7ca;
            border-radius: 6px;
            padding: 11px 12px;
            color: var(--ink);
        }

        .primary {
            min-width: 92px;
            min-height: 46px;
            border: 0;
            border-radius: 6px;
            background: var(--teal);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 750;
        }

        .primary:hover {
            background: var(--teal-dark);
        }

        .primary:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .side {
            display: grid;
            gap: 20px;
        }

        .side-body {
            padding: 16px;
        }

        .quick {
            display: grid;
            gap: 8px;
        }

        .quick button {
            text-align: left;
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--ink);
            background: #fff;
        }

        .quick button:hover {
            border-color: var(--teal);
            background: var(--teal-soft);
        }

        .source-list {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .source-list li {
            border-left: 3px solid var(--teal);
            padding: 4px 0 4px 10px;
            color: var(--muted);
            font-size: 13px;
            word-break: break-word;
        }

        .source-empty {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        @media (max-width: 860px) {
            .topbar {
                padding: 0 16px;
            }

            main {
                padding: 24px 16px;
            }

            .layout {
                grid-template-columns:1fr;
            }

            .side {
                grid-template-columns:1fr 1fr;
            }

            .page-head {
                align-items: start;
                flex-direction: column;
            }
        }

        @media (max-width: 560px) {
            .brand {
                font-size: 16px;
            }

            .nav a {
                padding: 8px;
                font-size: 13px;
            }

            .identity {
                width: 100%;
            }

            .side {
                grid-template-columns:1fr;
            }

            .chat {
                min-height: 520px;
            }

            .message {
                max-width: 94%;
            }

            .composer {
                align-items: end;
            }

            .primary {
                min-width: 46px;
                width: 46px;
                font-size: 0;
            }

            .primary svg {
                width: 19px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/"><span class="brand-mark"><i data-lucide="bot"></i></span>智服中台</a>
    <nav class="nav" aria-label="主导航"><a href="/" aria-current="page">客户服务</a><a
            href="/admin.html">管理员审批</a></nav>
</header>
<main>
    <section class="page-head">
        <div><h1>客户服务</h1>
            <p>订单查询、政策咨询和售后请求均会保留可追溯的处理记录。</p></div>
        <div class="identity"><i data-lucide="shield-check"></i><span>演示账户</span><strong>u_zhang</strong></div>
    </section>
    <div class="layout">
        <section class="panel chat" aria-label="客服对话">
            <div class="panel-title"><h2>对话会话</h2><span class="status"><span class="dot"></span><span
                    id="connection-status">服务已连接</span></span></div>
            <div id="messages" class="messages" aria-live="polite">
                <div id="empty-state" class="empty"><i data-lucide="messages-square"></i>
                    <h3>您好，有什么可以帮您？</h3>
                    <p>可以查询订单物流、了解退换货政策，或提交售后申请。</p></div>
            </div>
            <div class="composer"><label for="q" class="sr-only">输入问题</label><textarea id="q" rows="1"
                                                                                           placeholder="例如：CS20260002 的物流到哪里了？"></textarea>
                <button id="send-button" class="primary" type="button"><i data-lucide="send"></i><span>发送</span>
                </button>
            </div>
        </section>
        <aside class="side">
            <section class="panel">
                <div class="panel-title"><h2>快捷提问</h2></div>
                <div class="side-body quick">
                    <button type="button" data-question="CS20260002 的物流到哪里了？">查询订单 CS20260002</button>
                    <button type="button" data-question="退货政策是什么？">了解退货政策</button>
                    <button type="button" data-question="我要退订单 CS20260002">提交退款申请</button>
                </div>
            </section>
            <section class="panel">
                <div class="panel-title"><h2>本轮参考来源</h2></div>
                <div class="side-body">
                    <ul id="sources" class="source-list"></ul>
                    <p id="source-empty" class="source-empty">政策问答会在这里展示可引用的资料。</p></div>
            </section>
        </aside>
    </div>
</main>
<script>
    // session_id 保存在浏览器本地：刷新页面后仍能命中同一条 LangGraph Checkpoint。
    const sessionId = localStorage.sessionId || (localStorage.sessionId = crypto.randomUUID());
    const output = document.querySelector('#messages');
    const sources = document.querySelector('#sources');
    const input = document.querySelector('#q');
    const sendButton = document.querySelector('#send-button');
    const emptyState = document.querySelector('#empty-state');
    const sourceEmpty = document.querySelector('#source-empty');
    const connectionStatus = document.querySelector('#connection-status');

    // textContent 而不是 innerHTML：模型输出不能被当作 HTML 执行，避免 XSS。
    function addMessage(text, kind = 'agent') {
        emptyState?.remove();
        const element = document.createElement('article');
        if (kind === 'system' || kind === 'handoff') {
            element.className = kind;
            element.innerHTML = kind === 'handoff' ? '<strong>需要人工处理</strong>' : '';
            const content = document.createElement('span');
            content.textContent = text;
            element.append(content);
        } else {
            element.className = `message ${kind === 'mine' ? 'mine' : ''}`;
            const meta = document.createElement('div');
            meta.className = 'message-meta';
            meta.textContent = kind === 'mine' ? '您' : '智能客服';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            element.append(meta, bubble);
        }
        output.append(element);
        output.scrollTop = output.scrollHeight;
    }

    function addSource(source) {
        sourceEmpty.hidden = true;
        const item = document.createElement('li');
        item.textContent = typeof source === 'string' ? source : (source.source || source.content || JSON.stringify(source));
        sources.append(item);
    }

    async function send() {
        const question = input.value.trim();
        if (!question) return;

        addMessage(question, 'mine');
        input.value = '';
        sendButton.disabled = true;
        connectionStatus.textContent = '正在处理';
        sources.replaceChildren();
        sourceEmpty.hidden = false;

        try {
            // EventSource 只能发送 GET；POST SSE 必须用 fetch + ReadableStream 手动读取。
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-User-Id': 'u_zhang'},
                body: JSON.stringify({
                    question,
                    session_id: sessionId,
                    // 每次用户点击使用新键；网络重试应复用同一个键。
                    idempotency_key: crypto.randomUUID(),
                }),
            });
            if (!response.ok || !response.body) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.detail || `请求失败：${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                // 网络 chunk 不等于完整 SSE 帧，所以先累积到 buffer。
                buffer += decoder.decode(value, {stream: true});
                const frames = buffer.split('\n\n');
                buffer = frames.pop(); // 保留不完整帧，等待下一次网络数据。

                for (const frame of frames) {
                    if (!frame.startsWith('data: ')) continue;
                    const event = JSON.parse(frame.slice(6));
                    if (event.type === 'token') addMessage(event.content);
                    if (event.type === 'delegation') addMessage(event.message, 'system');
                    if (event.type === 'source') addSource(event.data);
                    if (event.type === 'handoff' || event.type === 'approval_required') {
                        addMessage(`${event.reason || event.message}${event.ticket_id ? `，工单：${event.ticket_id}` : ''}`, 'handoff');
                    }
                    if (event.type === 'error') addMessage(event.message, 'handoff');
                }
            }
        } catch (error) {
            addMessage(`请求未完成：${error.message}`, 'handoff');
        } finally {
            // 无论成功、异常还是网络中断，都恢复发送按钮。
            sendButton.disabled = false;
            connectionStatus.textContent = '服务已连接';
            input.focus();
        }
    }

    sendButton.addEventListener('click', send);
    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            send();
        }
    });
    document.querySelectorAll('[data-question]').forEach((button) => button.addEventListener('click', () => {
        input.value = button.dataset.question;
        input.focus();
    }));
    lucide.createIcons();
</script>
</body>
</html>
